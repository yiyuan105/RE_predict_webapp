{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.brief }}">
  <link rel="icon" type="image/svg+xml" href="{% static 'frontend/assets/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
  <div class="page{% if page.wide %} page--wide{% endif %}">
    <header class="site-head">
      <!-- 导航：品牌与页面入口，文案见 content.py -->
      <a class="site-brand" href="{% url 'home' %}">生态系统呼吸预测</a>
      <nav class="site-nav" aria-label="页面导航">
        {% for item in nav_items %}
        <a class="site-nav-link{% if item.key == page.key %} is-active{% endif %}"
           href="{% url item.url_name %}"{% if item.key == page.key %} aria-current="page"{% endif %}>{{ item.nav_label }}</a>
        {% endfor %}
      </nav>
    </header>

    <header class="header">
      <!-- 文案：页面标题与网页简述，集中在 content.py，勿在各页硬编码 -->
      <h1>{{ page.title }}</h1>
      <p class="intro">{{ page.brief }}</p>
    </header>

    <main id="main">
      {% block content %}{% endblock %}
    </main>

    {% include "RE_predict_webapp/_footer.html" %}
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
