{% extends "RE_predict_webapp/base.html" %}
{% load static %}

{% block content %}
    <form class="form" id="predict-form" novalidate>
      <div class="fields">
        <div class="field">
          <!-- 文案：纬度字段名 -->
          <label for="lat">纬度</label>
          <input id="lat" name="lat" type="text" inputmode="decimal" autocomplete="off"
                 spellcheck="false" maxlength="16" placeholder="39.90"
                 aria-describedby="form-message">
        </div>
        <div class="field">
          <!-- 文案：经度字段名 -->
          <label for="lon">经度</label>
          <input id="lon" name="lon" type="text" inputmode="decimal" autocomplete="off"
                 spellcheck="false" maxlength="17" placeholder="116.40"
                 aria-describedby="form-message">
        </div>
      </div>

      <!-- 文案：默认提示（校验失败时会被替换） -->
      <p class="hint" id="form-message">北纬、东经为正；纬度 −90 ~ 90，经度 −180 ~ 180。</p>

      <!-- 文案：提交按钮 -->
      <button class="button" id="submit-btn" type="submit">
        <span id="submit-label">开始预测</span>
      </button>
    </form>

    <section class="result" aria-live="polite">
      <!-- 文案：结果区标题 -->
      <h2 class="result-title">预测结果</h2>
      <div id="result-body">
        <p class="placeholder">尚未预测</p>
      </div>
    </section>
{% endblock %}

{% block scripts %}
  <script src="{% static 'frontend/js/common.js' %}" defer></script>
  <script src="{% static 'frontend/js/app.js' %}" defer></script>
{% endblock %}
