{% extends "RE_predict_webapp/base.html" %}
{% load static %}

{% block content %}
    <p class="hint" id="sources-status" role="status">正在加载数据来源…</p>

    <div class="source-groups" id="source-list"></div>

    <section class="panel" id="feature-panel" hidden>
      <h2 class="section-title">模型输入特征与气象变量</h2>
      <ul class="feature-list" id="feature-list"></ul>
      <p class="hint" id="weather-line"></p>
    </section>

    <noscript>
      <p class="hint">数据来源清单来自只读接口 <code>/api/sources/</code>，需要启用 JavaScript 才能查看。</p>
    </noscript>
{% endblock %}

{% block scripts %}
  <script src="{% static 'frontend/js/common.js' %}" defer></script>
  <script src="{% static 'frontend/js/sources.js' %}" defer></script>
{% endblock %}
